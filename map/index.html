<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" type="text/css" href="/map/graphics/style/style.css">  
<title>World Map</title>
<style>
* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #000; font: 15px/1.5 Georgia, serif; }

#viewport { position: absolute; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#viewport.dragging { cursor: grabbing; }

#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world canvas, #world img { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
#world img { pointer-events: none; }

/* Labels */
#labels { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.label { position: absolute; left: 0; top: 0; width: max-content; max-width: 160px; text-align: center; line-height: 1.15; font-size: clamp(11px, 1.3vw, 14px); color: #000; background: #fff; border: 1px solid #000; pointer-events: none; }
.label.link { pointer-events: auto; cursor: pointer; font-weight: bold; }
.label.link:hover { text-decoration: underline; }
.label.sel { background: #000; color: #fff; border: 1px solid #000; }
.label.hide { visibility: hidden; pointer-events: none; }

/* Coordinates */
#coords { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; font: 12px/1 monospace; background: #fff; color: #000; border: 1px solid #000; }
#coords[hidden] { display: none; }

/* Panels */
#sidebar, #panel { position: absolute; background: #fff; color: #000; overflow: auto; border: 1px solid #000; }
#sidebar { left: 0; top: 0; bottom: 0; width: 340px; z-index: 5; transform: translateX(-100%); }
#sidebar.open { transform: none; }
#panel { right: 0; top: 0; bottom: 0; width: 300px; z-index: 6; }
#panelBar { display: none; }
#panelBody { border-top: 1px solid #000; }

#close { position: absolute; right: 12px; top: 10px; background: #fff; border: 1px solid #000; color: #000; font-size: 24px; cursor: pointer; }

h1 { margin: 0 0 4px; font-size: 26px; }
h2 { margin: 0; font-size: 20px; }
h3 { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; }

.muted, .region { color: #555; margin: 0; }
.big { font-size: 30px; line-height: 1.1; }

#s-body dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px; margin: 16px 0; }
#s-body dd { margin: 0; }
#s-body ul, #w-list { list-style: none; margin: 0; padding: 0; }
#s-body img { max-width: 100%; }

a.xlink { color: #000; text-decoration: underline; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
a.xlink.dead { color: #777; pointer-events: none; }
img.flag { height: .9em; width: auto; max-width: 1.6em; border: 1px solid #000; }

.pie svg { display: block; width: min(100%, 170px); margin: 8px auto 12px; }
.legend { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 11px; height: 11px; border: 1px solid #000; flex: none; }
.legend span { flex: 1; }
.legend b { font-weight: normal; color: #555; }

#search { display: block; width: 100%; margin: 0 0 8px; padding: 4px 6px; background: #fff; color: #000; border: 1px solid #000; font: 14px Georgia, serif; }
#w-list li { border-bottom: 1px solid #000; }
#w-list li[hidden] { display: none; }

#status { position: absolute; left: 12px; bottom: 10px; z-index: 1; font-size: 13px; color: #000; pointer-events: none; }

/* Mobile */
@media (max-width: 800px) {
  #sidebar { top: auto; left: 0; right: 0; bottom: 46px; width: auto; height: 50vh; transform: translateY(calc(100% + 46px)); }
  #sidebar.open { transform: none; }
  #panel { top: auto; left: 0; right: 0; width: auto; height: 46px; border-top: 1px solid #000; overflow: hidden; }
  #panel.expanded { height: 55vh; overflow: auto; }
  #panelBar { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 46px; background: #fff; border: 1px solid #000; color: #000; font: inherit; cursor: pointer; position: sticky; top: 0; }
  #status { display: none; }
}

/* Modes and legend */
#modes { position: absolute; top: 12px; right: 312px; z-index: 4; width: 210px; font: 13px/1.3 Georgia, serif; }
#modeSel, #subSel { width: 100%; background: #fff; color: #000; border: 1px solid #000; font: inherit; }
#subSel { margin-top: 6px; }
#subSel[hidden] { display: none; }
#legend { margin-top: 6px; background: #fff; color: #000; border: 1px solid #000; }
#legend:empty { display: none; }
.lg-bar { height: 10px; border: 1px solid #000; margin-bottom: 4px; }
.lg-row { display: flex; justify-content: space-between; color: #000; }
.lg-cat { display: flex; align-items: center; gap: 8px; }
.lg-cat i { width: 11px; height: 11px; border: 1px solid #000; flex: none; }
@media (max-width: 800px) { #modes { right: 12px; } }

/* Right panel: closable on desktop (on mobile it already collapses to its bottom bar) */
#panelClose, #panelOpen { background: #fff; border: 1px solid #000; color: #000; cursor: pointer; }
#panelClose { position: absolute; right: 12px; top: 10px; font-size: 24px; }
#panelOpen { display: none; position: absolute; right: 12px; top: 12px; z-index: 6; padding: 4px 10px; font: 13px Georgia, serif; }
@media (min-width: 801px) {
  body.panel-closed #panel { transform: translateX(100%); }
  body.panel-closed #panelOpen { display: block; }
  body.panel-closed #modes { right: 110px; }
}
@media (max-width: 800px) { #panelClose { display: none; } }
</style>
</head>
<body>
<div id="viewport" tabindex="0">
  <div id="world">
    <canvas id="fill"></canvas>
    <canvas id="highlight"></canvas>
    <canvas id="hover"></canvas>
    <img id="borders" src="/img/borders.png" alt="">
  </div>
  <div id="labels"></div>
</div>
<div id="modes"><select id="modeSel" aria-label="Map mode"></select><select id="subSel" aria-label="Option" hidden></select><div id="legend"></div></div>
<div id="coords" hidden=""></div>

<aside id="sidebar" aria-live="polite">
  <button id="close" aria-label="Close sidebar">×</button>
  <div id="s-body"></div>
</aside>

<aside id="panel">
  <button id="panelClose" aria-label="Close panel">×</button>
  <button id="panelBar" aria-expanded="false"><span id="barText">World · 0</span><span id="barArrow">▲</span></button>
  <div id="panelBody">
    <h2>World</h2>
    <div class="big" id="w-pop">0</div>
    <p class="muted">total population</p>
    <h3>Largest ethnic groups</h3>
    <div id="w-pie"><div class="pie"><p class="muted">No population data.</p></div></div>
    <h3>Countries</h3>
    <input id="search" type="search" placeholder="Search countries…" aria-label="Search countries" autocomplete="off">
    <ul id="w-list"></ul>
  </div>
</aside>

<button id="panelOpen" aria-label="Open panel">◀ World</button>

<div id="status">Loading…</div>

<script>
/* =====================  CONFIG (edit these)  ===================== */
const FILL_SRC = "/img/fill.png";
const SIDEBAR_DIR = "/sidebars/";
// file names (without .html) in SIDEBAR_DIR. Every one of these is fetched and parsed on load.
const SIDEBARS = [
"281998", // republic of china
"251a99", // federated cliques of sichuan
"281997", // macau

// europe
"101166", // france
"league" // league of nations

// Labels: x/y are pixel coordinates on the map image.
// open: id of a sidebar to open on click (optional). prio: higher wins when labels collide. size: font multiplier.
const LABELS = [
  { text: "Republic of China", x: 3000, y: 617, open: "281998", prio: 10 },
  { text: "Federated Cliques of Sichuan",   x: 2888, y: 607, open: "251a99", prio: 2 },
  { text: "Shandong",   x: 3000, y: 538, open: "281799", prio: 2 },
  { text: "Fengtian",   x: 3004, y: 426, open: "271799", prio: 3 },
  { text: "Sinkiang",   x: 2665, y: 481, open: "231a96", prio: 3 },
  { text: "Guangdong",   x: 3004, y: 687, open: "2a1799", prio: 3 },
  { text: "Guangxi",   x: 2950, y: 692, open: "2a1799", prio: 3 },
  { text: "Ma Qinghai",   x: 2795, y: 540, open: "261796", prio: 3 },
  { text: "Ma Gansu",   x: 2805, y: 485, open: "291897", prio: 3 },
  { text: "Ma Ningxia",   x: 2879, y: 498, open: "291899", prio: 3 },
  { text: "Shanxi",   x: 2922, y: 503, open: "281699", prio: 3 },
  { text: "Yunnan",   x: 2869, y: 680, open: "251897", prio: 3 },
  { text: "Kham",   x: 2802, y: 602, open: "231a97", prio: 3 },
  { text: "Macau",   x: 2995, y: 706, open: "281997", prio: 1 },
  { text: "Hong Kong",   x: 3003, y: 702, open: "281996", prio: 2 },
  { text: "Tibet",   x: 2696, y: 588, open: "c9c9c9", prio: 3 },
  { text: "Mongolia",   x: 2808, y: 410, open: "eb5d70", prio: 4 },

  { text: "Korea",   x: 3089, y: 519, open: "fdc9ee", prio: 4 },
  { text: "Taiwan",   x: 3074, y: 685, open: "fec9ee", prio: 2 },

  { text: "Burma",   x: 2822, y: 722, open: "001776", prio: 4 },

  { text: "Vietnam",   x: 2942, y: 774, open: "vietnam", prio: 3 },
  { text: "Tonkin",   x: 2915, y: 712, open: "a61634", prio: 2 },
  { text: "Annam",   x: 2956, y: 784, open: "a81634", prio: 2 },
  { text: "Cochinchina",   x: 2940, y: 849, open: "a71634", prio: 2 },


{ text: "League of Nations",   x: 1882,  y: 417, open: "league",     prio: 3 },

{ text: "United States of America",   x: 814, y: 512, open: "483665", prio: 3 },
{ text: "Canada",   x: 847, y: 304, open: "421523", prio: 3 },
{ text: "Mexico",   x: 764, y: 695, open: "546f4d", prio: 3 },
  { text: "Atlantic Ocean",         x: 1386,  y: 646 },
  { text: "Indian Ocean",         x: 2683,  y: 1117 },
  { text: "Pacific Ocean",         x: 3455,  y: 678 },
  { text: "Pacific Ocean",         x: 259,  y: 1098 },
  { text: "Arctic Ocean",         x: 1834,  y: 87 },
];

// ---- COLORS (defined here once, not in the sidebars) ----
// Ethnic group colors (pie charts + the "Largest ethnic group" map mode). Name must match the text of the <li>.
// Any group you don't list gets an automatic color, so you only need to add the ones you care about.
const ETHNICITY_COLORS = {
  'Han Chinese': '#c0392b',
  'Tibetan':     '#e0b13d',
  'Mongol':      '#3d85c6',
  'French':      '#2c5aa0',
};
// Religion colors (Religion map mode). Name must match data-religion in the sidebars. Unlisted ones get an automatic color.
const RELIGION_COLORS = {
  'Christianity': '#3d85c6',
  'Islam':        '#2e8b57',
  'Judaism':      '#5b6fc7',
  'Hinduism':     '#e8742c',
  'Buddhism':     '#e0b13d',
  'Sikhism':      '#c27ba0',
  'Folk religion':'#8e6b3d',
  'Irreligion':   '#888888',
};

// How dark a shape gets while the mouse is over it (0 = not at all, 1 = black).
const HOVER_DARKEN = 0.18;

// Infobox table, built automatically from each article's data-* attributes.
// Format: ['Label shown', 'attribute name'].   data-capital="Exampleton"  ->  Capital: Exampleton
// Attribute names with dashes become camelCase:  data-head-of-state  ->  'headOfState'
// 'population', 'worldshare', 'gdp' and 'religion' are handled for you. Rows that have no value are skipped.
// Population and GDP of a country automatically include its regions.
const INFOBOX = [
  ['Capital', 'capital'],
  ['Government', 'government'],
  ['Ideology', 'ideology'],
  ['Religion', 'religion'],
  ['Population', 'population'],
  ['World share', 'worldshare'],
  ['GDP', 'gdp'],
];

// Map modes: recolor the fill by a value per country. value(rec) returns a number (numeric:true -> gradient)
// or a string (-> categories). Regions fall back to their parent country when they have no value of their own.
// Sidebar root attributes are available as r.attrs, e.g. data-government="Republic" -> r.attrs.government.
// Optional per mode: colors {category:'#hex'}, colorOf(category), ramp ['#low',...,'#high'], log, format(n).
// clickOpen(rec): if it returns a sidebar id, clicking a country in this mode opens that sidebar (used by Factions).
const MODES = [
  { id: 'political',  label: 'Political' },
  { id: 'population', label: 'Population', value: r => r.total || null, numeric: true, log: true, ramp: ['#e8f1f8', '#6baed6', '#08306b'] },
  { id: 'gdp',        label: 'GDP', value: r => r.gdpTotal || null, numeric: true, log: true, format: money, ramp: ['#eaf5e4', '#74c476', '#00441b'] },
  { id: 'ethnicity',  label: 'Largest ethnic group', value: r => [...r.ethAll].sort((a, b) => b.pop - a.pop)[0]?.name, colorOf: n => ethColor(n) },
  { id: 'government', label: 'Government', value: r => r.attrs.government, colors: { Republic: '#3d85c6', Monarchy: '#e0b13d' } },
  { id: 'ideology',   label: 'Ideology',   value: r => r.attrs.ideology },
  // Religion: write data-religion="Christianity" (or "Christianity, Islam") in a sidebar. Pick a religion in the second dropdown.
  { id: 'religion',   label: 'Religion',
    sub: () => [...religions].sort(),
    value: (r, rel) => !r.religions.length ? null : (r.religions.includes(rel) ? 'above' : 'below'),
    colorOf: c => c === 'above' ? religionColor(curSub) : '#e3e3e3',
    hide: ['below'], nodata: '#e3e3e3', nodataLabel: 'Not a main religion',
    catLabel: () => '1,000,000+ followers' },
  // Factions: write data-faction="league" (the id of the faction's sidebar) in a country's sidebar.
  // Clicking a country in this mode opens the faction's sidebar. The faction's color is its data-highlight (or automatic).
  { id: 'faction',    label: 'Faction', value: r => r.attrs.faction, colorOf: id => factionColor(id), catLabel: id => data.get(id)?.name || id,
    clickOpen: r => { const f = r.attrs.faction || data.get(r.parent)?.attrs.faction; return f && data.has(f) ? f : null; } },
];

const GAP_SEARCH_RADIUS = 2;   // px: how far to look when you click on a transparent 1px border
const MAX_ZOOM = 24, MOBILE = "(max-width:800px)";

/* =====================  HELPERS / STATE  ===================== */
const $ = id => document.getElementById(id);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = n => Math.round(n).toLocaleString('en-US');
function money(n) {
  const a = Math.abs(n);
  return '$' + (a >= 1e12 ? (n / 1e12).toFixed(2) + ' T' : a >= 1e9 ? (n / 1e9).toFixed(2) + ' B' : a >= 1e6 ? (n / 1e6).toFixed(1) + ' M' : fmt(n));
}
const cssHex = s => s ? (String(s).startsWith('#') ? s : '#' + s) : null;
const toInt = s => parseInt(String(s).replace('#', ''), 16);
const hexOf = k => k.toString(16).padStart(6, '0');
const hexToRgb = s => [1, 3, 5].map(i => parseInt(s.replace('#', '').padStart(6, '0').slice(i - 1, i + 1), 16));
const hashHue = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 360;
const autoColor = s => hsl2hex(hashHue(s), 55, 55);
const ethColor = n => ETHNICITY_COLORS[n] || autoColor(n);
const religionColor = n => RELIGION_COLORS[n] || autoColor(n || '');
const factionColor = id => { const f = data.get(id); return f && f.hasHighlight ? f.highlight : autoColor(id); };

const viewport = $('viewport'), world = $('world'), fillC = $('fill'), hlC = $('highlight'), hovC = $('hover');
const fillCtx = fillC.getContext('2d', { willReadFrequently: true }), hlCtx = hlC.getContext('2d'), hovCtx = hovC.getContext('2d');
let W = 0, H = 0, px = null, worldPop = 0, current = null;
const data = new Map();         // sidebar id -> record
const colorOwner = new Map();   // color int -> sidebar id
const religions = new Set();    // religion names, filled from data-religion in the articles
const stats = new Map();        // color int -> bounding box on the map

/* =====================  SIDEBAR DOCUMENTS  ===================== */
async function loadSidebars() {
  await Promise.all(SIDEBARS.map(async id => {
    try {
      const res = await fetch(SIDEBAR_DIR + id + ".html");
      if (!res.ok) throw new Error(res.status);
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      const root = doc.querySelector('[data-type]') || doc.body, d = root.dataset;
      const rec = {
        id, root, type: d.type || 'entity', name: d.name || id, parent: d.parent || null,
        colors: (d.color || '').split(/[\s,]+/).filter(Boolean).map(toInt),
        highlight: d.highlight || '#ffffff', hasHighlight: !!d.highlight, list: d.list,
        flag: doc.getElementById('flag')?.getAttribute('src') || null,
        pop: +d.population || 0, gdp: +d.gdp || 0, attrs: Object.assign({}, d),
      };
      rec.eth = [...root.querySelectorAll('.ethnicities li')].map(li => ({
        name: li.textContent.trim(),
        pop: li.dataset.pop ? +li.dataset.pop : (+li.dataset.pct || 0) / 100 * rec.pop,
      }));
      if (!rec.pop) rec.pop = rec.eth.reduce((s, e) => s + e.pop, 0);
      rec.religions = (d.religion || '').split(',').map(s => s.trim()).filter(Boolean);
      rec.religions.forEach(r => religions.add(r));
      data.set(id, rec);
    } catch (err) { console.warn("Could not load sidebar", id, err); }
  }));
  for (const r of data.values()) for (const c of r.colors) colorOwner.set(c, r.id);
  // Regions are separate territories outside their overlord's own numbers, so their
  // population, GDP and ethnic groups are ADDED to the overlord's totals.
  for (const r of data.values()) {
    const regs = childrenOf(r.id).filter(c => c.type === 'region');
    r.total = r.pop + regs.reduce((s, c) => s + c.pop, 0);
    r.gdpTotal = r.gdp + regs.reduce((s, c) => s + c.gdp, 0);
    const m = new Map();
    for (const e of [...r.eth, ...regs.flatMap(c => c.eth)]) m.set(e.name, (m.get(e.name) || 0) + e.pop);
    r.ethAll = [...m].map(([name, pop]) => ({ name, pop }));
  }
  buildPanel();
}

const childrenOf = id => [...data.values()].filter(r => r.parent === id);
const memberColors = r => [...r.colors, ...childrenOf(r.id).flatMap(c => c.colors)];

function addFlag(a, id) {
  const src = data.get(id)?.flag;
  if (!src) return;
  const f = new Image(); f.className = 'flag'; f.alt = '';
  f.onerror = () => f.remove();
  f.src = src; a.append(f);
}

/* ---------- pie chart (colors come from ETHNICITY_COLORS above) ---------- */
const NS = 'http://www.w3.org/2000/svg';
function pie(items, max = 0) {
  items = items.filter(i => i.pop > 0).sort((a, b) => b.pop - a.pop);
  if (max && items.length > max) {
    const rest = items.slice(max).reduce((s, i) => s + i.pop, 0);
    items = [...items.slice(0, max), { name: 'Other', pop: rest, color: '#5b6b79' }];
  }
  const total = items.reduce((s, i) => s + i.pop, 0), wrap = h('div', 'pie');
  if (!total) { wrap.append(h('p', 'muted', 'No population data.')); return wrap; }
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '-1.02 -1.02 2.04 2.04');
  let a = -Math.PI / 2;
  items.forEach(it => {
    it.color = it.color || ethColor(it.name);
    const f = it.pop / total, b = a + f * 2 * Math.PI;
    const el = document.createElementNS(NS, f > .9999 ? 'circle' : 'path');
    if (f > .9999) el.setAttribute('r', '1');
    else el.setAttribute('d', `M0 0L${Math.cos(a)} ${Math.sin(a)}A1 1 0 ${f > .5 ? 1 : 0} 1 ${Math.cos(b)} ${Math.sin(b)}Z`);
    el.setAttribute('fill', it.color); el.setAttribute('stroke', '#1a232c'); el.setAttribute('stroke-width', '.012');
    const t = document.createElementNS(NS, 'title'); t.textContent = `${it.name}: ${(f * 100).toFixed(1)}%`; el.append(t);
    svg.append(el); a = b;
  });
  wrap.append(svg);
  const ul = h('ul', 'legend');
  items.forEach(it => {
    const li = h('li'), sw = h('i'); sw.style.background = it.color;
    li.append(sw, h('span', null, it.name), h('b', null, (it.pop / total * 100).toFixed(1) + '%'));
    ul.append(li);
  });
  wrap.append(ul);
  return wrap;
}

/* ---------- right panel: world total, world ethnicities, country list ---------- */
function buildPanel() {
  const countries = [...data.values()].filter(r => r.type === 'country');
  worldPop = countries.reduce((s, r) => s + r.total, 0);
  $('w-pop').textContent = fmt(worldPop);
  $('barText').textContent = 'World · ' + fmt(worldPop);
  const agg = new Map();
  for (const c of countries) for (const e of c.ethAll) {
    const a = agg.get(e.name) || { name: e.name, pop: 0 };
    a.pop += e.pop; agg.set(e.name, a);
  }
  $('w-pie').replaceChildren(pie([...agg.values()], 8));
  const list = [...data.values()]
    .filter(r => r.list === 'false' ? false : (r.type === 'country' || r.list === 'true'))
    .sort((a, b) => a.name.localeCompare(b.name));
  $('w-list').replaceChildren(...list.map(r => {
    const li = h('li'), a = h('a', 'xlink', r.name); a.href = '#';
    a.onclick = e => { e.preventDefault(); select(r.id); };
    addFlag(a, r.id); li.append(a); return li;
  }));
  filterList();
}
function filterList() {
  const t = $('search').value.trim().toLowerCase();
  $('w-list').querySelectorAll('li').forEach(li => { li.hidden = !!t && !li.textContent.toLowerCase().includes(t); });
}
$('search').addEventListener('input', filterList);
const setPanelClosed = c => { document.body.classList.toggle('panel-closed', c); saveState(); };
$('panelClose').onclick = () => setPanelClosed(true);
$('panelOpen').onclick = () => setPanelClosed(false);
$('panelBar').onclick = () => {
  const open = $('panel').classList.toggle('expanded');
  $('panelBar').setAttribute('aria-expanded', open); $('barArrow').textContent = open ? '▼' : '▲';
  saveState();
};

/* =====================  SELECTION  ===================== */
function openSidebar() {
  $('sidebar').classList.add('open'); $('s-body').parentElement.scrollTop = 0;
  if (matchMedia(MOBILE).matches) { $('panel').classList.remove('expanded'); $('barArrow').textContent = '▲'; }

const sidebarsReady = loadSidebars();
const img = new Image();
img.onload = async () => {
  W = img.width; H = img.height;
  for (const c of [fillC, hlC, hovC]) { c.width = W; c.height = H; }
  $('borders').style.width = W + 'px';
  fillCtx.imageSmoothingEnabled = false; fillCtx.drawImage(img, 0, 0);
  try { px = fillCtx.getImageData(0, 0, W, H).data; }
  catch (e) { $('status').textContent = "Canvas blocked: serve this folder with a local server (e.g. Live Server), not file://"; return; }
  // one pass: bounding box of every color (used to fly the camera to a country/region)
  let lastK = -1, s = null;
  for (let i = 0, p = 0; i < px.length; i += 4, p++) {
    if (px[i + 3] < 200) continue;
    const k = (px[i] << 16) | (px[i + 1] << 8) | px[i + 2];
    if (k !== lastK) { s = stats.get(k); if (!s) stats.set(k, s = { x0: 1e9, y0: 1e9, x1: -1, y1: -1 }); lastK = k; }
    const x = p % W, y = (p / W) | 0;
    if (x < s.x0) s.x0 = x; if (x > s.x1) s.x1 = x; if (y < s.y0) s.y0 = y; if (y > s.y1) s.y1 = y;
  }
  fitToScreen();
  await sidebarsReady;
  initModes();
  restoreSavedState();
  $('status').textContent = "Click a country · right-click for its overlord · scroll or pinch to zoom · drag to pan";
};
img.onerror = () => $('status').textContent = "Could not load " + FILL_SRC;
img.src = FILL_SRC;
</script>
